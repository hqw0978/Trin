
name: Fetch A-share market breadth

on:
  workflow_dispatch:

  schedule:
    # UTC 01:15 至 07:45；对应北京时间 09:15 至 15:45
    # 工作日每 30 分钟执行一次
    - cron: "15,45 1-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fetch-a-share-market-breadth
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install akshare pandas

      - name: Fetch market data
        run: python fetch_market.py

      - name: Save JSON data to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json data/history.json

          if git diff --cached --quiet; then
            echo "JSON data has no changes; nothing to commit."
          else
            git commit -m "Update A-share market breadth data"
            git push
          fi
