<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>A股市场广度 · TRIN手机版</title>
<style>
:root{color-scheme:dark;--bg:#080d17;--panel:#121b2b;--panel2:#182438;--line:#26364e;--muted:#91a3bc;--text:#eef4ff;--red:#ff6877;--green:#39d6a0;--amber:#ffca66;--blue:#76b7ff}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0c1423,#080d17 35%);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif;padding:12px 12px 30px;max-width:760px;margin-inline:auto}
header{padding:10px 4px 12px}
h1{font-size:20px;line-height:1.2;margin:0 0 6px}
.sub{color:var(--muted);font-size:12px;margin:4px 0}
.tag{display:inline-block;border:1px solid #344761;border-radius:99px;padding:2px 7px;font-size:11px;color:#b9c8dc}
.panel{background:linear-gradient(145deg,var(--panel),#101827);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.section-title{font-size:14px;font-weight:bold;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.metric{background:var(--panel2);border-radius:10px;padding:11px;min-width:0}
.metric .label{color:var(--muted);font-size:12px}
.metric .value{font-size:22px;font-weight:700;letter-spacing:-0.3px;margin:4px 0 2px}
.metric .note{font-size:11px;color:var(--muted)}
.red{color:var(--red)}
.green{color:var(--green)}
.amber{color:var(--amber)}
.blue{color:var(--blue)}
.bar{height:8px;border-radius:99px;overflow:hidden;background:#26354a;display:flex;margin:8px 0 4px}
.bar .up{background:var(--red)}
.bar .down{background:var(--green)}
.bar .flat{background:#718096}
.split{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.note-box{font-size:13px;color:#d7e3f5;background:#0b1422;border:1px solid #26364e;border-radius:10px;padding:12px}
.note-box strong{color:#fff}
.footer{color:#8293aa;font-size:11px;padding:6px 2px 0;margin-top:12px}
.btn{width:100%;border:1px solid #3b5272;border-radius:9px;padding:10px;color:#eaf2ff;background:#1a2b43;font-size:13px}
.btn:disabled{opacity:.6}
.pill{font-size:11px;padding:3px 7px;border-radius:99px;background:#26364e;color:#c6d5e9}
</style>
</head>
<body>
<header>
<h1>市场广度 TRIN（手机版）</h1>
<div class="sub">A股全市场指标 <span class="tag">10 分钟快照</span></div>
<div class="sub" id="liveStatus">正在读取最新快照…</div>
</header>

<section class="panel">
<div class="section-title">市场总览 <span class="pill" id="sourceBadge">加载中</span></div>
<button class="btn" id="liveBtn">🔄 获取最新数据</button>
<div class="grid" style="margin-top:12px;">
<div class="metric"><div class="label">上证指数</div><div class="value" id="idx">--</div><div class="note" id="idxNote">--</div></div>
<div class="metric"><div class="label">上涨占比</div><div class="value" id="upPct">--</div><div class="note">样本 <span id="totalCnt">--</span>只</div></div>
<div class="metric"><div class="label">TRIN</div><div class="value amber" id="trinCalc">--</div><div class="note">广度指标</div></div>
<div class="metric"><div class="label">总成交额</div><div class="value" id="totalAmt">--</div><div class="note">亿元</div></div>
</div>
</section>

<section class="panel">
<div class="section-title">涨跌家数</div>
<div class="grid">
<div class="metric"><div class="label">上涨家数</div><div class="value red" id="advDisplay">0</div></div>
<div class="metric"><div class="label">下跌家数</div><div class="value green" id="decDisplay">0</div></div>
</div>
<div class="bar"><div class="up" id="upBar" style="width:0%"></div><div class="down" id="downBar" style="width:0%"></div><div class="flat" id="flatBar" style="width:0%"></div></div>
<div class="split">
<span class="red">上涨 <b id="upPct2">0%</b></span>
<span class="green">下跌 <b id="downPct">0%</b></span>
<span>平盘 <b id="flatPct">0%</b></span>
</div>
</section>

<section class="panel">
<div class="section-title">状态解读</div>
<div class="note-box" id="summary">读取数据中…</div>
</section>

<div class="footer">
数据：新浪财经行情，沪深A股（不含北交所）。快照由 GitHub Actions 在交易日每 10 分钟生成；页面打开期间每 5 分钟自动拉取一次，也可以点按钮立即拉。<br>
仅供学习演示，不构成投资建议。
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = (n, d = 3) => Number.isFinite(n) ? n.toFixed(d) : '—';
const CACHE_KEY = 'trin:last';

function render(d, mode) {
  const trin = Number(d.trin), total = Number(d.total) || 0;
  $('advDisplay').textContent = d.adv;
  $('decDisplay').textContent = d.dec;
  $('upPct').textContent = Number(d.upPct).toFixed(2) + '%';
  $('upPct2').textContent = Number(d.upPct).toFixed(2) + '%';
  $('downPct').textContent = Number(d.downPct).toFixed(2) + '%';
  $('flatPct').textContent = Number(d.flatPct).toFixed(2) + '%';
  $('upBar').style.width = d.upPct + '%';
  $('downBar').style.width = d.downPct + '%';
  $('flatBar').style.width = d.flatPct + '%';
  $('trinCalc').textContent = fmt(trin);
  $('totalCnt').textContent = total;
  $('totalAmt').textContent = Number(d.totalAmt).toFixed(0);
  if (d.idxPrice) $('idx').textContent = Number(d.idxPrice).toFixed(2);
  if (d.idxChg) {
    $('idxNote').textContent = d.idxChg;
    $('idxNote').className = 'note ' + (String(d.idxChg).startsWith('-') ? 'green' : 'red');
  }

  const up = Number(d.upPct), when = d.time || '';
  let tip = up < 30 ? '⚠️ 市场广度极弱，普跌行情'
          : up < 50 ? '⚠️ 广度偏弱，反弹需要上涨家数继续放大确认'
          : '✅ 市场广度改善';
  $('summary').innerHTML =
    `<strong>${tip}</strong><br>上涨 ${d.adv} 家，下跌 ${d.dec} 家，平盘 ${d.flat} 家；上涨占比 ${up.toFixed(2)}%；TRIN=${trin.toFixed(3)}。<br>口径：${d.universe || '沪深A股（不含北交所）'}，共 ${total} 只。<br>数据时间：${when}<br>仅供演示，不构成投资建议。`;

  $('sourceBadge').textContent = mode === 'fresh' ? '🆕 刚刷新' : '📸 快照';
  $('sourceBadge').style.color = mode === 'fresh' ? '#39d6a0' : '#76b7ff';
}

function readCache() {
  try {
    const d = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (d && Number(d.total)) return d;
  } catch (e) {}
  return null;
}

async function loadSnapshot(bust) {
  const r = await fetch('data.json' + (bust ? '?t=' + Date.now() : ''), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  if (!d || !Number(d.total)) throw new Error('快照为空');
  localStorage.setItem(CACHE_KEY, JSON.stringify(d));
  return d;
}

async function refresh() {
  const btn = $('liveBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 拉取最新快照…';
  try {
    const d = await loadSnapshot(true);
    render(d, 'fresh');
    $('liveStatus').textContent = '已刷新，数据时间：' + (d.time || '未知');
  } catch (e) {
    const c = readCache();
    if (c) { render(c, 'snapshot'); }
    $('liveStatus').textContent = '❌ 刷新失败（' + e.message + '），仍显示上一份数据';
  } finally {
    btn.disabled = false;
    btn.textContent = '🔄 获取最新数据';
  }
}

$('liveBtn').addEventListener('click', refresh);

loadSnapshot(false)
  .then(d => {
    render(d, 'snapshot');
    $('liveStatus').textContent = '数据时间：' + (d.time || '未知') + '（交易日每 10 分钟自动更新）';
  })
  .catch(() => {
    const c = readCache();
    if (c) {
      render(c, 'snapshot');
      $('liveStatus').textContent = '离线缓存：' + (c.time || '未知') + '（没连上 data.json）';
      return;
    }
    $('liveStatus').textContent = '没有读到数据，点按钮重试';
    $('sourceBadge').textContent = '未连接';
  });

// 打开着不动也会自己变新：每 5 分钟拉一次快照
setInterval(() => {
  if (document.visibilityState === 'visible') {
    loadSnapshot(true).then(d => {
      render(d, 'snapshot');
      $('liveStatus').textContent = '数据时间：' + (d.time || '未知');
    }).catch(() => {});
  }
}, 5 * 60 * 1000);
</script>
</body>
</html>
