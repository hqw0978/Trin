<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIN 阿姆斯特指标 A股市场广度</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;}
        body{background:#0f172a;color:#fff;padding:20px;max-width:600px;margin:0 auto;}
        h1{text-align:center;margin-bottom:24px;font-size:24px;}
        .card{background:#1e293b;border-radius:16px;padding:24px;margin-bottom:16px;}
        .row{display:flex;justify-content:space-between;margin:12px 0;font-size:16px;}
        .trin-value{font-size:48px;font-weight:bold;text-align:center;margin:20px 0}
        .tip{margin-top:16px;color:#94a3b8;font-size:14px;line-height:1.6}
        button{width:100%;padding:14px;border:none;border-radius:12px;background:#2563eb;color:white;font-size:16px;margin-top:10px;cursor:pointer}
        button:disabled{background:#334155;cursor:not-allowed}
    </style>
</head>
<body>
    <h1>TRIN 阿姆斯特指标</h1>
    <div class="card">
        <div id="status">等待加载数据</div>
        <div class="trin-value" id="trinBox">--</div>
        <div class="row">
            <span>上涨家数</span>
            <span id="upCount">--</span>
        </div>
        <div class="row">
            <span>下跌家数</span>
            <span id="downCount">--</span>
        </div>
        <div class="row">
            <span>上涨总成交量</span>
            <span id="upVol">--</span>
        </div>
        <div class="row">
            <span>下跌总成交量</span>
            <span id="downVol">--</span>
        </div>
        <button id="refreshBtn">刷新数据</button>
        <div class="tip">
            TRIN公式：(上涨家数 ÷ 下跌家数) ÷ (上涨成交量 ÷ 下跌成交量)<br>
            ✅ TRIN ＜1：多头力量更强<br>
            ✅ TRIN ＞1：空头力量更强，市场抛压较重
        </div>
    </div>

<script>
const statusEl = document.getElementById('status');
const trinBox = document.getElementById('trinBox');
const upCountEl = document.getElementById('upCount');
const downCountEl = document.getElementById('downCount');
const upVolEl = document.getElementById('upVol');
const downVolEl = document.getElementById('downVol');
const refreshBtn = document.getElementById('refreshBtn');

async function fetchTrin(){
    refreshBtn.disabled = true;
    statusEl.innerText = "正在拉取A股涨跌数据...";
    try{
        // ⚠️注意：浏览器跨域限制，GitHub Pages直接访问外部行情接口会存在跨域问题
        statusEl.innerText = "当前版本演示计算逻辑；真实行情接口存在浏览器跨域限制";
        // ============这里是演示：你可以在交易日手动填入上涨、下跌家数与成交量计算TRIN============
        // 如果你需要完整可用版本，有两种方式解决跨域：
        // 1.搭建后端代理
        // 2.使用通达信/同花顺本地接口
        alert("当前网页版本：前端版本解决跨域还需要代理。\n\n备选方案：如果你想要，我可以直接写通达信手机版公式版本的TRIN阿姆斯特指标，直接在通达信里面使用，不需要网页！")

        // 示例计算演示
        const up = 2200;
        const down = 2600;
        const upV = 2800;
        const downV = 3300;
        const trin = (up / down) / (upV / downV);

        upCountEl.innerText = up;
        downCountEl.innerText = down;
        upVolEl.innerText = upV;
        downVolEl.innerText = downV;
        trinBox.innerText = trin.toFixed(3);
        statusEl.innerText = "演示计算完成";
    }catch(e){
        statusEl.innerText = "数据获取失败："+e.message;
    }
    refreshBtn.disabled = false;
}

refreshBtn.onclick = fetchTrin;
</script>
</body>
</html>
